name: Exporter pour Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Chaque lundi : relire la clé Android provisoire pour que le cache ne l'efface pas (sept jours sans accès).
  schedule:
    - cron: "17 6 * * 1"

env:
  GODOT_VERSION: "4.7.2"

permissions:
  contents: write

jobs:
  export:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Récupérer Godot et les modèles d'export
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Importer les ressources
        run: ./godot --headless --path . --import || true

      - name: Exporter l'exécutable
        run: |
          mkdir -p build
          ./godot --headless --path . --export-release "Windows Desktop" build/Smarves.exe
          test -f build/Smarves.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Smarves-windows
          path: build/
          retention-days: 30

      - name: Préparer l'archive de téléchargement
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd build
          zip -q ../Smarves-windows.zip Smarves.exe

      - name: Déplacer l'étiquette de la dernière version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git tag -f derniere-version
          git push -f origin derniere-version

      - name: Publier la Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: derniere-version
          name: Smarves — dernière version
          body: |
            Version construite automatiquement depuis main (${{ github.sha }}).
            Sur Windows (64 bits) : télécharger Smarves-installateur.exe et le lancer ; il installe le jeu
            sans droits administrateur et pose un raccourci dans le menu Démarrer et sur le bureau.
            Sans installation : Smarves-windows.zip, à décompresser, puis lancer Smarves.exe.
            Sur téléphone Android : télécharger Smarves.apk depuis le téléphone et l'installer.
          files: Smarves-windows.zip
          make_latest: true

  # L'installateur Windows (Inno Setup, installer/smarves.iss), construit sur un runner Windows à
  # partir de l'exécutable exporté, puis essayé de bout en bout : installation silencieuse, raccourcis,
  # lancement du jeu par le raccourci, désinstallation. Sur main, il rejoint la Release.
  installateur-windows:
    needs: export
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: Smarves-windows
          path: build

      - name: Construire l'installateur
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup introuvable" }
          $version = "${{ github.sha }}".Substring(0, 7)
          & $iscc /Q "/DVersion=$version" installer\smarves.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC a échoué ($LASTEXITCODE)" }
          if (-not (Test-Path build\Smarves-installateur.exe)) { throw "Pas d'installateur" }
          # L'exécutable porte l'icône de Smarves (assets/icone/smarves.ico), pas celle de Godot.
          Add-Type -AssemblyName System.Drawing
          $exe = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path build\Smarves.exe).Path).ToBitmap()
          $ref = (New-Object System.Drawing.Icon((Resolve-Path assets\icone\smarves.ico).Path, 32, 32)).ToBitmap()
          $ecart = 0
          for ($x = 0; $x -lt 32; $x += 2) { for ($y = 0; $y -lt 32; $y += 2) {
            $a = $exe.GetPixel($x, $y); $b = $ref.GetPixel($x, $y)
            $ecart += [Math]::Abs($a.R - $b.R) + [Math]::Abs($a.G - $b.G) + [Math]::Abs($a.B - $b.B)
          } }
          $ecart = $ecart / 256
          "Écart moyen entre l'icône de l'exécutable et celle de Smarves : $ecart"
          if ($ecart -gt 40) { throw "L'exécutable n'a pas l'icône de Smarves (écart $ecart)" }
          "Taille de l'installateur : {0:N1} Mo" -f ((Get-Item build\Smarves-installateur.exe).Length / 1MB) >> $env:GITHUB_STEP_SUMMARY

      - name: Essayer l'installateur
        run: |
          $dossier = Join-Path $env:LOCALAPPDATA "Programs\Smarves"
          $menu = Join-Path ([Environment]::GetFolderPath("Programs")) "Smarves.lnk"
          $bureau = Join-Path ([Environment]::GetFolderPath("Desktop")) "Smarves.lnk"
          $p = Start-Process build\Smarves-installateur.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=installation.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content installation.log; throw "Installation : code $($p.ExitCode)" }
          foreach ($f in @("$dossier\Smarves.exe", "$dossier\unins000.exe", $menu, $bureau)) {
            if (-not (Test-Path $f)) { Get-Content installation.log; throw "Absent après installation : $f" }
            "Installé : $f"
          }
          $cle = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6F3B0C52-8A0E-4B8D-9E1C-5D2A7C4E9B31}_is1"
          if (-not (Test-Path $cle)) { throw "Smarves absent de « Applications installées »" }

          # Lancer le jeu comme le ferait un double-clic sur le raccourci du bureau.
          $cible = (New-Object -ComObject WScript.Shell).CreateShortcut($bureau).TargetPath
          if ($cible -ne "$dossier\Smarves.exe") { throw "Le raccourci vise $cible" }
          $jeu = Start-Process $cible -ArgumentList "--headless", "--quit-after", "600" -Wait -PassThru -RedirectStandardOutput jeu.log -RedirectStandardError jeu-erreurs.log
          Get-Content jeu.log, jeu-erreurs.log | Select-Object -Last 20
          if ($jeu.ExitCode -ne 0) { throw "Le jeu installé s'est arrêté avec le code $($jeu.ExitCode)" }

          # Réinstaller par-dessus (mise à jour), puis désinstaller.
          $p = Start-Process build\Smarves-installateur.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Réinstallation : code $($p.ExitCode)" }
          Start-Process "$dossier\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          # Le désinstallateur se relance depuis un dossier temporaire : attendre qu'il ait fini.
          for ($i = 0; $i -lt 60 -and (Test-Path "$dossier\Smarves.exe"); $i++) { Start-Sleep 1 }
          foreach ($f in @("$dossier\Smarves.exe", $menu, $bureau, $cle)) {
            if (Test-Path $f) { throw "Encore là après désinstallation : $f" }
          }
          "Installation, raccourcis, lancement, mise à jour et désinstallation vérifiés." >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: Smarves-installateur
          path: build/Smarves-installateur.exe
          retention-days: 30

      - name: Ajouter l'installateur à la Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: derniere-version
          files: build/Smarves-installateur.exe

  android:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Récupérer Godot et les modèles d'export
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          rm -f templates.tpz godot.zip

      - name: Installer les outils Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.1" "platforms;android-35" > /dev/null

      # La clé de signature n'est jamais dans le dépôt. Sur main, l'APK publié est signé par la clé de
      # version rangée dans les secrets du dépôt (SMARVES_ANDROID_KEYSTORE en base64 et
      # SMARVES_ANDROID_PASSWORD, alias « smarves ») : voir docs/WEB-MOBILE.md, « Signature ».
      # Tant que ces secrets manquent, main garde la clé provisoire mise en cache. Les PR signent
      # toujours avec une clé jetable fabriquée dans le job : leur APK ne sert qu'à essayer.
      - name: Retrouver la clé provisoire
        id: cle
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: ~/smarves-android.keystore
          key: smarves-android-keystore-v1

      - name: Préparer la clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.SMARVES_ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.SMARVES_ANDROID_PASSWORD }}
          CACHE_HIT: ${{ steps.cle.outputs.cache-hit }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/smarves-release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/smarves-release.keystore" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Signé par la clé de version (secrets du dépôt)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$CACHE_HIT" != "true" ]; then
              keytool -genkeypair -keystore ~/smarves-android.keystore -storepass smarves -keypass smarves \
                -alias smarves -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Smarves, O=Smarves, C=FR"
            fi
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/smarves-android.keystore" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=smarves" >> "$GITHUB_ENV"
            echo "::warning::Secrets SMARVES_ANDROID_KEYSTORE et SMARVES_ANDROID_PASSWORD absents : APK signé par la clé provisoire."
          else
            keytool -genkeypair -keystore ~/smarves-jetable.keystore -storepass smarves -keypass smarves \
              -alias smarves -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Smarves essai, O=Smarves, C=FR"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/smarves-jetable.keystore" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=smarves" >> "$GITHUB_ENV"
            echo "APK d'essai signé par une clé jetable : il ne s'installe pas par-dessus celui de la Release." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Importer les ressources
        run: ./godot --headless --path . --import || true

      - name: Exporter l'APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: smarves
        run: |
          mkdir -p build
          ./godot --headless --path . --export-release "Android" build/Smarves.apk
          test -f build/Smarves.apk
          rm -f build/Smarves.apk.idsig
          # L'APK porte l'icône de Smarves : le premier plan adaptatif est notre jeton, pas le logo de Godot.
          python3 -m pip install -q pillow
          python3 - <<'PY'
          import io, zipfile
          from PIL import Image, ImageChops, ImageStat
          apk = zipfile.ZipFile("build/Smarves.apk")
          noms = [n for n in apk.namelist() if n.startswith("res/mipmap")]
          print("Icônes :", ", ".join(sorted(noms)))
          avant = [n for n in noms if "xxxhdpi" in n and "icon_foreground" in n]
          assert avant, "Pas de premier plan adaptatif xxxhdpi dans l'APK"
          ref = Image.open("assets/icone/android-avant-432.png").convert("RGBA")
          lu = Image.open(io.BytesIO(apk.read(avant[0]))).convert("RGBA").resize(ref.size)
          ecart = sum(ImageStat.Stat(ImageChops.difference(lu, ref)).mean) / 4
          print("Écart moyen avec l'icône de Smarves :", round(ecart, 1))
          assert ecart < 12, "L'APK n'a pas l'icône de Smarves"
          PY
          echo "Taille de l'APK : $(du -h build/Smarves.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Smarves-android
          path: build/Smarves.apk
          retention-days: 30

  publier-android:
    needs: [export, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Smarves-android

      - name: Ajouter l'APK à la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: derniere-version
          files: Smarves.apk

  garder-la-cle:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Relire la clé provisoire
        uses: actions/cache/restore@v4
        with:
          path: ~/smarves-android.keystore
          key: smarves-android-keystore-v1
