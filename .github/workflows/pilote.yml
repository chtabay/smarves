name: Pilote des pensionnaires

# À toute heure, le vrai jeu sans écran pour chaque pensionnaire dont l'assistant veut jouer
# (docs/PENSIONNAIRES.md, « Le pilote »). La tâche prouve qui elle est à la fonction doublures par son
# jeton OIDC de GitHub, sans secret ; la fonction lui dit quels pensionnaires lancer.
#
# Une tâche dure un peu moins de six heures (la limite de GitHub). Toutes les demi-heures, une autre se
# met en file (le groupe « pilote » n'en garde qu'une en attente) : elle prend le relais dès que la
# précédente s'arrête. Le dépôt est public : les minutes ne sont pas comptées.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pilote
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"
  SMARVES_PILOTE_URL: https://alvxrjftenialifyktyz.supabase.co/functions/v1/doublures/pilote

jobs:
  pilote:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - name: Ouvrir la tâche
        id: ouvrir
        run: |
          oidc=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=smarves-pilote" | jq -r .value)
          r=$(curl -sS -X POST "$SMARVES_PILOTE_URL" -H "authorization: Bearer $oidc" -H 'content-type: application/json' -d '{"action":"pilote_ouvrir"}')
          if [ "$(echo "$r" | jq -r .ok)" != "true" ]; then
            echo "Refusé : $(echo "$r" | jq -c '{raison}')"
            exit 1
          fi
          echo "::add-mask::$(echo "$r" | jq -r .jeton)"
          echo "jeton=$(echo "$r" | jq -r .jeton)" >> "$GITHUB_OUTPUT"

      - name: Récupérer Godot
        if: steps.ouvrir.outputs.jeton != ''
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot

      - name: Importer les ressources
        if: steps.ouvrir.outputs.jeton != ''
        run: ./godot --headless --path . --import || true

      - name: Tenir les pensionnaires jusqu'à la fin du jeton
        if: steps.ouvrir.outputs.jeton != ''
        env:
          SMARVES_PILOTE_JETON: ${{ steps.ouvrir.outputs.jeton }}
        run: |
          declare -A pid
          mkdir -p journaux
          while true; do
            r=$(curl -sS --max-time 40 -X POST "$SMARVES_PILOTE_URL" -H "authorization: Bearer $SMARVES_PILOTE_JETON" \
              -H 'content-type: application/json' -d '{"action":"pilote_demandes"}' || echo '{}')
            if [ "$(echo "$r" | jq -r '.fin // false')" = "true" ]; then
              echo "Fin : $(echo "$r" | jq -r '.raison // ""')"
              break
            fi
            for p in $(echo "$r" | jq -r '.pensionnaires // [] | .[]'); do
              if [ -n "${pid[$p]:-}" ] && kill -0 "${pid[$p]}" 2>/dev/null; then continue; fi
              n=$(echo -n "$p" | sha1sum | cut -c1-8)
              echo "Lancer le jeu de $n"
              # Chaque pensionnaire a son propre dossier de partie (user://).
              XDG_DATA_HOME="$RUNNER_TEMP/partie-$n" SMARVES_PENSIONNAIRE="$p" \
                ./godot --headless --path . -- --pilote > "journaux/$n.log" 2>&1 &
              pid[$p]=$!
            done
            [ -z "$r" ] || [ "$r" = "{}" ] && sleep 5
          done
          for p in "${!pid[@]}"; do kill "${pid[$p]}" 2>/dev/null || true; done
          sleep 2

      - name: Journaux des jeux
        if: always() && steps.ouvrir.outputs.jeton != ''
        run: |
          for f in journaux/*.log; do [ -f "$f" ] && { echo "::group::$f"; tail -n 200 "$f"; echo "::endgroup::"; }; done; true
